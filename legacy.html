<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lecture">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: #fff8e7;
    font-family: system-ui, sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  nav {
    flex: 0 0 14vh;
    display: flex;
    gap: 4px;
    padding: 4px;
    box-sizing: border-box;
  }
  nav button {
    flex: 1;
    border: 0;
    border-radius: 12px;
    background: #cfe3ff;
    color: #1d3a66;
    font: 700 min(5vw, 6vh) system-ui, sans-serif;
    cursor: pointer;
  }
  nav button.actif { background: #2f6fde; color: #fff; }
  #grille {
    flex: 1;
    min-height: 0;
    display: grid;
    gap: 4px;
    padding: 0 4px 4px;
  }
  .cellule {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    border-radius: 8px;
    font-weight: 700;
    color: #2b2b2b;
    cursor: pointer;
    overflow: hidden;
  }
  .cellule:active { background: #ffe9a8; }
  #grille.libre { display: flex; flex-direction: column; }
  .reglages {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    align-items: center;
    background: #fff;
    border-radius: 8px;
    padding: 2vh 0;
  }
  .reglage {
    display: flex;
    align-items: center;
    gap: 3vw;
    font: 700 6vh system-ui, sans-serif;
    color: #2b2b2b;
  }
  .reglage .nom { width: 22vw; text-align: right; }
  .reglage .valeur { width: 14vw; text-align: center; }
  .reglage button, .gros {
    border: 0;
    border-radius: 12px;
    background: #cfe3ff;
    color: #1d3a66;
    font: 700 6vh system-ui, sans-serif;
    cursor: pointer;
  }
  .reglage button { width: 10vh; height: 10vh; }
  .gros { padding: 1.5vh 8vw; font-size: 7vh; }
  .gros.jouer { background: #2fa84f; color: #fff; }
  .gros.stop { background: #d93636; color: #fff; }
  .themes { display: flex; gap: 2vw; }
  .themes button {
    border: 0;
    border-radius: 12px;
    background: #cfe3ff;
    color: #1d3a66;
    font: 700 5vh system-ui, sans-serif;
    padding: 2vh 3vw;
    cursor: pointer;
  }
  .themes button.actif { background: #2f6fde; color: #fff; }
  .nombre {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    border-radius: 8px;
    font-weight: 700;
    color: #2b2b2b;
  }
  .libre .stop { margin-top: 4px; }
  #tourne {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    background: #2f6fde;
    color: #fff;
    font: 700 9vw system-ui, sans-serif;
    text-align: center;
  }
  #tourne span { font-size: 25vw; }
  @media (orientation: portrait) { #tourne { display: flex; } }
</style>
</head>
<body>
<div id="tourne"><span>🔄</span>Tourne l'écran</div>
<nav id="menu"></nav>
<div id="grille"></div>
<script src="config.js" onerror="void 0"></script>
<script>
  // Chaque page : titre, colonnes/lignes,
  // et la liste des éléments. Le son d'un élément est <URL_SONS><dossier><ÉLÉMENT>.m4a
  // URL du dossier des sons, fournie par config.js (voir .env / .env.prod)
  const URL_SONS = window.CONFIG?.urlSons ?? "sons/";
  const LETTRES = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];
  const VOYELLES = ["A", "E", "I", "O", "U", "Y", "OU", "AU", "ON", "AN", "EN", "IN", "UN"];
  const MOTS = ["UN", "UNE", "DES", "LE", "LA", "LES", "ET", "EST", "IL", "ELLE",
                "À", "DE", "DU", "EN", "AU", "SUR", "SOUS", "DANS", "AVEC", "MON"];
  const NOMBRES = Array.from({ length: 99 }, (_, i) => String(i + 1));

  const PAGES = [
    { titre: "Alphabet", dossier: "", grille: [6, 5], items: LETTRES, minuscule: true },
    { titre: "Voyelles", dossier: "", grille: [5, 3], items: VOYELLES },
    { titre: "Petits mots", dossier: "mots/", grille: [5, 4], items: MOTS },
    { titre: "Nombres", dossier: "nombres/", grille: [10, 10], items: ["", ...NOMBRES] },
    { titre: "Jeux", rendu: reglagesJeux },
  ];

  const menu = document.getElementById("menu");
  const grille = document.getElementById("grille");
  const cache = {};

  function jouer(url) {
    const audio = cache[url] ??= new Audio(url);
    audio.currentTime = 0;
    audio.play().catch(() => {});
  }

  // --- Page Jeux : réglages, puis affichage aléatoire jusqu'à STOP ---
  const THEMES = { "Lettres": LETTRES, "Voyelles": VOYELLES, "Petits mots": MOTS, "Nombres": NOMBRES };
  const jeu = { theme: "Nombres", de: 15, a: 20, secondes: 3 };
  let minuteur = null;

  function arreter() {
    clearInterval(minuteur);
    minuteur = null;
  }

  function el(tag, props = {}, ...enfants) {
    const e = Object.assign(document.createElement(tag), props);
    e.append(...enfants);
    return e;
  }

  function reglagesJeux() {
    const bornes = {
      de: [1, () => jeu.a],
      a: [() => jeu.de, NOMBRES.length],
      secondes: [1, 30],
    };
    const val = v => (typeof v === "function" ? v() : v);

    const boite = el("div", { className: "reglages" });

    const themes = el("div", { className: "themes" });
    for (const nom of Object.keys(THEMES)) {
      themes.append(el("button", {
        textContent: nom,
        className: nom === jeu.theme ? "actif" : "",
        onclick: () => { jeu.theme = nom; reglagesJeux(); },
      }));
    }
    boite.append(themes);

    const lignes = [["secondes", "Secondes"]];
    if (jeu.theme === "Nombres") lignes.unshift(["de", "De"], ["a", "À"]);
    for (const [cle, nom] of lignes) {
      const affiche = el("span", { className: "valeur", textContent: jeu[cle] });
      const bouton = (texte, pas) => el("button", {
        textContent: texte,
        onclick: () => {
          const [min, max] = bornes[cle].map(val);
          jeu[cle] = Math.min(max, Math.max(min, jeu[cle] + pas));
          affiche.textContent = jeu[cle];
        },
      });
      boite.append(el("div", { className: "reglage" },
        el("span", { className: "nom", textContent: nom }),
        bouton("−", -1), affiche, bouton("+", 1)));
    }

    boite.append(el("button", { className: "gros jouer", textContent: "JOUER", onclick: lancerJeu }));
    grille.replaceChildren(boite);
  }

  function lancerJeu() {
    const liste = jeu.theme === "Nombres" ? NOMBRES.slice(jeu.de - 1, jeu.a) : THEMES[jeu.theme];
    const zone = el("div", { className: "nombre" });
    const stop = el("button", {
      className: "gros stop",
      textContent: "STOP",
      onclick: () => { arreter(); reglagesJeux(); },
    });
    grille.replaceChildren(zone, stop);

    let dernier = null;
    const suivant = () => {
      let x;
      do { x = liste[Math.floor(Math.random() * liste.length)]; }
      while (x === dernier && liste.length > 1);
      dernier = x;
      const texte = jeu.theme === "Lettres" ? `${x} ${x.toLowerCase()}` : x;
      zone.textContent = texte;
      zone.style.fontSize = `min(${130 / texte.length}vw, 45vh)`;
    };
    suivant();
    minuteur = setInterval(suivant, jeu.secondes * 1000);
  }

  function afficher(i) {
    const page = PAGES[i];
    arreter();
    [...menu.children].forEach((b, j) => b.classList.toggle("actif", i === j));
    grille.classList.toggle("libre", !!page.rendu);
    if (page.rendu) {
      grille.style.gridTemplateColumns = grille.style.gridTemplateRows = "";
      page.rendu();
      return;
    }
    const [c, l] = page.grille;
    grille.style.gridTemplateColumns = `repeat(${c}, 1fr)`;
    grille.style.gridTemplateRows = `repeat(${l}, 1fr)`;
    grille.replaceChildren(...page.items.map(item => {
      const d = document.createElement("div");
      if (!item) return d;
      d.className = "cellule";
      const texte = page.minuscule ? `${item} ${item.toLowerCase()}` : item;
      d.textContent = texte;
      // taille d'une case : largeur 100vw / colonnes, hauteur (100vh - menu) / lignes
      d.style.fontSize = `min(${0.65 * 86 / l}vh, ${100 / c / texte.length}vw)`;
      d.onclick = () => jouer(`${URL_SONS}${page.dossier}${item}.m4a`);
      return d;
    }));
  }

  PAGES.forEach((p, i) => {
    const b = document.createElement("button");
    b.textContent = p.titre;
    b.onclick = () => afficher(i);
    menu.appendChild(b);
  });
  afficher(0);
</script>
</body>
</html>
